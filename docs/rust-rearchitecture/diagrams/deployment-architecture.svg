<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 420" width="980" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deployment architecture diagram">
  <title>FAA APRA Rust Re-architecture: Deployment Architecture</title>
  <defs>
    <style>
      .b { fill:#0e1f3c; stroke:#1f3a5f; stroke-width:1.2; }
      .t { fill:#dbeafe; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .l { stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow3); }
      .n { fill:#0a1426; stroke:#1f3a5f; }
      .bg { fill: #0b1220; }
    </style>
    <marker id="arrow3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" class="bg"/>
  
  <rect x="20" y="20" width="200" height="60" rx="8" class="b"/>
  <text x="52" y="55" class="t">Clients</text>

  <rect x="260" y="20" width="240" height="60" rx="8" class="b"/>
  <text x="290" y="55" class="t">API Gateway (legacy paths)</text>

  <rect x="520" y="10" width="440" height="180" rx="8" class="n"/>
  <text x="690" y="35" class="t">Kubernetes</text>
  <rect x="540" y="60" width="180" height="60" rx="8" class="b"/>
  <text x="570" y="95" class="t">cycle-svc</text>
  <rect x="740" y="60" width="180" height="60" rx="8" class="b"/>
  <text x="770" y="95" class="t">ifr-svc</text>
  <rect x="540" y="130" width="180" height="60" rx="8" class="b"/>
  <text x="558" y="165" class="t">vfr-svc</text>
  <rect x="740" y="130" width="180" height="60" rx="8" class="b"/>
  <text x="764" y="165" class="t">cifp-nasr-svc</text>

  <rect x="520" y="210" width="440" height="180" rx="8" class="n"/>
  <text x="700" y="235" class="t">Data Layer</text>
  <rect x="540" y="260" width="180" height="60" rx="8" class="b"/>
  <text x="570" y="295" class="t">Redis (cache)</text>
  <rect x="740" y="260" width="180" height="60" rx="8" class="b"/>
  <text x="760" y="295" class="t">Denodo / Metadata</text>

  <rect x="740" y="330" width="180" height="60" rx="8" class="b"/>
  <text x="756" y="365" class="t">aeronav / tod</text>

  <line x1="220" y1="50" x2="260" y2="50" class="l"/>
  <line x1="500" y1="50" x2="540" y2="90" class="l"/>
  <line x1="500" y1="50" x2="740" y2="90" class="l"/>
  <line x1="500" y1="50" x2="540" y2="160" class="l"/>
  <line x1="500" y1="50" x2="740" y2="160" class="l"/>
</svg>
