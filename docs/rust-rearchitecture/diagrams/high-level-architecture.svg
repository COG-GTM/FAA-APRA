<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 420" width="980" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="High-level architecture diagram">
  <title>FAA APRA Rust Re-architecture: High-Level System Architecture</title>
  <defs>
    <style>
      .b { fill:#0e1f3c; stroke:#1f3a5f; stroke-width:1.2; }
      .t { fill:#dbeafe; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      .s { fill:#0f766e; }
      .g { fill:#1e3a8a; }
      .l { stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow); }
      .bg { fill: #0b1220; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" class="bg"/>
  
  <!-- Client Layer -->
  <rect x="20" y="30" width="220" height="60" rx="8" class="b"/>
  <text x="40" y="66" class="t">Clients (EFB, GIS, Gov apps)</text>

  <!-- API Gateway -->
  <rect x="280" y="20" width="220" height="80" rx="8" class="b g"/>
  <text x="305" y="66" class="t">API Gateway (compat routes)</text>

  <!-- Services Row -->
  <rect x="540" y="20" width="200" height="80" rx="8" class="b s"/>
  <text x="560" y="46" class="t">Cycle Service</text>
  <text x="560" y="68" class="t">(28/56-day, cache)</text>

  <rect x="760" y="20" width="200" height="80" rx="8" class="b s"/>
  <text x="780" y="46" class="t">IFR/Enroute Service</text>
  <text x="780" y="68" class="t">URL builders</text>

  <rect x="540" y="120" width="200" height="80" rx="8" class="b s"/>
  <text x="560" y="146" class="t">VFR Sectional/TAC</text>
  <text x="560" y="168" class="t">Table-driven</text>

  <rect x="760" y="120" width="200" height="80" rx="8" class="b s"/>
  <text x="780" y="146" class="t">CIFP/NASR</text>
  <text x="780" y="168" class="t">28-day</text>

  <rect x="540" y="220" width="200" height="80" rx="8" class="b s"/>
  <text x="560" y="256" class="t">DDOF</text>
  <text x="560" y="278" class="t">Daily + changeset</text>

  <!-- Data Layer -->
  <rect x="540" y="320" width="420" height="70" rx="8" class="b"/>
  <text x="560" y="350" class="t">External Repos (aeronav.faa.gov, tod.faa.gov)</text>
  <text x="560" y="370" class="t">Denodo/Metadata (read-only), Redis cache (optional)</text>

  <!-- Lines -->
  <line x1="240" y1="60" x2="280" y2="60" class="l"/>
  <line x1="500" y1="60" x2="540" y2="60" class="l"/>
  <line x1="500" y1="60" x2="760" y2="60" class="l"/>
  <line x1="500" y1="60" x2="540" y2="160" class="l"/>
  <line x1="500" y1="60" x2="760" y2="160" class="l"/>
  <line x1="500" y1="60" x2="540" y2="260" class="l"/>

  <line x1="640" y1="300" x2="640" y2="320" class="l"/>
  <line x1="860" y1="300" x2="860" y2="320" class="l"/>
</svg>
