<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 260" width="980" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data flow diagram">
  <title>FAA APRA Rust Re-architecture: Data Flow</title>
  <defs>
    <style>
      .b { fill:#0e1f3c; stroke:#1f3a5f; stroke-width:1.2; }
      .t { fill:#dbeafe; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .l { stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow4); }
      .bg { fill: #0b1220; }
    </style>
    <marker id="arrow4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" class="bg"/>
  
  <rect x="20" y="20" width="200" height="60" rx="8" class="b"/>
  <text x="64" y="55" class="t">Client</text>

  <rect x="240" y="20" width="220" height="60" rx="8" class="b"/>
  <text x="276" y="55" class="t">API Gateway</text>

  <rect x="480" y="20" width="220" height="60" rx="8" class="b"/>
  <text x="518" y="55" class="t">Rust Service</text>

  <rect x="720" y="20" width="240" height="60" rx="8" class="b"/>
  <text x="760" y="55" class="t">External FAA Repos</text>

  <rect x="480" y="120" width="220" height="60" rx="8" class="b"/>
  <text x="516" y="155" class="t">Denodo/Metadata</text>

  <rect x="240" y="120" width="220" height="60" rx="8" class="b"/>
  <text x="300" y="155" class="t">Cache (Redis)</text>

  <line x1="220" y1="50" x2="240" y2="50" class="l"/>
  <line x1="460" y1="50" x2="480" y2="50" class="l"/>
  <line x1="700" y1="50" x2="720" y2="50" class="l"/>
  <line x1="480" y1="80" x2="480" y2="120" class="l"/>
  <line x1="350" y1="80" x2="350" y2="120" class="l"/>
</svg>
