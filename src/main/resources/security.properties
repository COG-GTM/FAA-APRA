# APRA Security Configuration
# Implements STIG/NIST 800-53 security requirements

# =============================================================================
# Rate Limiting Configuration (STIG V-220636)
# =============================================================================
# Enable/disable rate limiting
security.ratelimit.enabled=true

# Maximum requests per window
security.ratelimit.max.requests=100

# Window size in seconds
security.ratelimit.window.seconds=60

# Comma-separated list of IPs exempt from rate limiting (e.g., monitoring systems)
security.ratelimit.exempt.ips=

# =============================================================================
# Security Headers Configuration (STIG V-220641)
# =============================================================================
# Enable/disable security headers
security.headers.enabled=true

# Content Security Policy
security.headers.csp=default-src 'self'; frame-ancestors 'none'; form-action 'self'

# =============================================================================
# Audit Logging Configuration (STIG V-220635)
# =============================================================================
# Enable/disable audit logging
security.audit.enabled=true

# Audit log directory
security.audit.log.directory=/var/log/apra

# Application name for audit logs
security.audit.app.name=faa-apra

# =============================================================================
# Authentication Configuration (STIG V-220629)
# =============================================================================
# Enable/disable authentication (disabled by default for backward compatibility)
security.auth.enabled=false

# API key header name
security.auth.apikey.header=X-API-Key

# Maximum failed authentication attempts before lockout
security.auth.max.failed.attempts=5

# Account lockout duration in minutes
security.auth.lockout.duration.minutes=15

# =============================================================================
# Session Configuration (STIG V-220630)
# =============================================================================
# Session timeout in minutes
security.session.timeout.minutes=15
