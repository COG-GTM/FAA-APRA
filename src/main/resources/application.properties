# FAA Aeronautical Product Release API (APRA) Configuration
# Spring Boot 3.2.x

# Server Configuration
server.port=8080
server.servlet.context-path=/apra

# Proxy Configuration (migrated from web.xml)
# These can be overridden by environment variables or external config
apra.proxy.host=${APRA_PROXY_HOST:}
apra.proxy.port=${APRA_PROXY_PORT:8080}

# FAA Host Configuration
apra.aeronav.host=${APRA_AERONAV_HOST:http://aeronav.faa.gov}
apra.ddof.host=${APRA_DDOF_HOST:http://tod.faa.gov}
apra.nfdc.host=${APRA_NFDC_HOST:http://nfdc.faa.gov}
apra.denodo.host=${APRA_DENODO_HOST:https://soadev.smext.faa.gov}

# URL Verification Flags
apra.tpp.check.flag=${APRA_TPP_CHECK_FLAG:false}
apra.sup.check.flag=${APRA_SUP_CHECK_FLAG:false}
apra.sectional.check.flag=${APRA_SECTIONAL_CHECK_FLAG:false}
apra.nasr.check.flag=${APRA_NASR_CHECK_FLAG:true}

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# Async Configuration for URL Verification
apra.async.url-verification.timeout-ms=5000
apra.async.url-verification.pool-size=10

# OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Logging Configuration
logging.level.gov.faa.ait.apra=INFO
logging.level.org.springframework.web=INFO
