name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build
        run: mvn clean compile -s .github/maven-settings.xml
      - name: Test (offline-safe only)
        run: mvn test -s .github/maven-settings.xml -Dtest="ChartCycleTest,DDOFTest,SectionalChartClientTest,KeyTest,TPPVolumeTest,SectionalChartTableTest,CityNameConversionTest" -DfailIfNoTests=false
