apiVersion: v1
kind: ServiceAccount
metadata:
  name: apra
  namespace: apra
  labels:
    app.kubernetes.io/name: apra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apra-role
  namespace: apra
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apra-rolebinding
  namespace: apra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apra-role
subjects:
  - kind: ServiceAccount
    name: apra
    namespace: apra
