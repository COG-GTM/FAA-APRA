apiVersion: configuration.konghq.com/v1
kind: KongIngress
metadata:
  name: apra-kong-ingress
  namespace: apra
proxy:
  protocol: http
  path: /apra
  connect_timeout: 10000
  read_timeout: 60000
  write_timeout: 60000
  retries: 3
route:
  strip_path: false
  preserve_host: true
  protocols:
    - https
    - http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apra-ingress
  namespace: apra
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/override: apra-kong-ingress
    konghq.com/plugins: apra-rate-limiting,apra-cors,apra-request-transformer
spec:
  rules:
    - host: soa.smext.faa.gov
      http:
        paths:
          - path: /apra
            pathType: Prefix
            backend:
              service:
                name: apra
                port:
                  number: 80
  tls:
    - hosts:
        - soa.smext.faa.gov
      secretName: apra-tls-secret
