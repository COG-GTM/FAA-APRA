apiVersion: v1
kind: Service
metadata:
  name: apra
  namespace: apra
  labels:
    app.kubernetes.io/name: apra
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: apra
---
apiVersion: v1
kind: Service
metadata:
  name: apra-headless
  namespace: apra
  labels:
    app.kubernetes.io/name: apra
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: apra
